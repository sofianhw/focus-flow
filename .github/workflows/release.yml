name: Release desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: |
            ${{ matrix.target }}
            wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Rust build tools
        run: |
          cargo install just --version 1.40.0 --locked
          cargo install cargo-leptos --version 0.3.7 --locked
          cargo install tauri-cli --version 2.9.5 --locked
      - run: just check
      - run: cargo tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Flow-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
